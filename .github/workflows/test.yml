name: test

# push할 때마다 단위 테스트를 돌린다. 테스트는 실제 토스 API를 호출하지 않고 .env도 필요 없으므로 시크릿을 쓰지 않는다
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 실행
        run: ./gradlew test --no-daemon --console=plain

      # 실패했을 때 원인을 볼 수 있게 테스트 보고서를 남긴다
      - name: 테스트 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: bot/build/reports/tests/test
          retention-days: 7
