spring.application.name=bot

# 프로젝트 루트의 .env 파일을 그대로 설정으로 읽어온다 (외부 라이브러리 없이 Spring Boot 내장 기능 사용)
spring.config.import=optional:file:../.env[.properties]

# 조회 전용 콘솔 앱이라 내장 웹서버를 띄우지 않는다 (1단계 규칙: 외부에 여는 API 없음)
spring.main.web-application-type=none

toss.api.base-url=https://openapi.tossinvest.com
toss.api.key=${TOSS_API_KEY}
toss.api.secret=${TOSS_API_SECRET}
toss.api.token-file-path=data/token.json
