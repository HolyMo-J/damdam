spring.application.name=bot

# 기본 스케줄러 풀 크기는 1이라 정지 파일 감시(5초), 시간 청산(오전 9시 5분), OCO 정기 점검(60초)이 같은 스레드를 공유한다.
# 그중 하나가 API 호출 지연으로 오래 걸리면 정지 파일/종료 요청 감지가 그동안 밀릴 수 있어 작업 개수만큼 늘린다
spring.task.scheduling.pool.size=3

# 프로젝트 루트의 .env 파일을 그대로 설정으로 읽어온다 (외부 라이브러리 없이 Spring Boot 내장 기능 사용)
spring.config.import=optional:file:../.env[.properties]

# 조회 전용 콘솔 앱이라 내장 웹서버를 띄우지 않는다 (1단계 규칙: 외부에 여는 API 없음)
spring.main.web-application-type=none

toss.api.base-url=https://openapi.tossinvest.com
toss.api.key=${TOSS_API_KEY}
toss.api.secret=${TOSS_API_SECRET}
toss.api.token-file-path=data/token.json

# 프로젝트 루트의 records 폴더 (계좌 식별값 없음, git 제외)
damdam.records.manual-trades-path=../records/manual_trades.csv

# 실제 주문 전송 여부. 기본값 false (모의 실행). 실전 전환 시 .env에 DAMDAM_LIVE_ORDERS=true 추가
damdam.orders.live-mode=${DAMDAM_LIVE_ORDERS:false}
# 자동 매도 1건당 최대 금액 (초과하면 거부하고 알림만 남김)
damdam.orders.max-amount-krw=100000
damdam.orders.max-amount-usd=71
# 하루 최대 자동 매도 횟수 (버그로 인한 폭주 방지용, 평소엔 걸리지 않을 정도로 넉넉하게)
damdam.orders.max-daily-count=10
# 연속 손실 몇 회에서 자동 매도를 정지할지
damdam.orders.max-consecutive-losses=3
damdam.orders.guard-state-path=data/auto_sell_guard.json
# 이 시각 이후에 새로 산 종목만 자동 매도 대상. 처음 실행할 때 자동으로 기록됨
damdam.orders.scope-start-path=data/auto_sell_scope_start.txt

# 정지 파일: 이 파일이 있으면 자동 매도와 OCO 등록/수정을 멈춘다 (재시작 불필요). 이미 등록된 OCO는 토스 서버에서 계속 동작한다
damdam.control.halt-file-path=data/STOP
# 종료 요청 파일: stop-listen.ps1이 만들면 봇이 스스로 정상 종료한다 (종료 알림과 종료 훅이 실행되게 하려는 용도)
damdam.control.shutdown-request-path=data/shutdown.request

# 디스코드 웹훅 주소는 비밀값이다. .env의 DAMDAM_DISCORD_WEBHOOK_URL로만 주입하고 코드, 로그, 문서에 쓰지 않는다. 비어 있으면 알림을 보내지 않는다
damdam.notification.discord-webhook-url=${DAMDAM_DISCORD_WEBHOOK_URL:}
# 같은 종류의 알림은 이 시간(초) 안에 한 번만 보낸다
damdam.notification.throttle-seconds=600
